name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['SahirApp.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: unzip -q SahirApp.zip
      - run: cd SahirApp && gradle assembleDebug
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v${{ github.run_number }} \
            SahirApp/app/build/outputs/apk/debug/app-debug.apk \
            --title "ساحر اللانهاية v${{ github.run_number }}" --notes "APK"
